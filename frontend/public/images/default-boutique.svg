<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D9DDDF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2B8A3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Building outline -->
  <g opacity="0.5">
    <!-- Main building -->
    <rect x="60" y="140" width="280" height="200" fill="none" stroke="#6E7F78" stroke-width="3"/>
    
    <!-- Roof -->
    <polygon points="60,140 200,60 340,140" fill="none" stroke="#6E7F78" stroke-width="3"/>
    
    <!-- Windows -->
    <rect x="90" y="180" width="40" height="40" fill="none" stroke="#6E7F78" stroke-width="2"/>
    <rect x="155" y="180" width="40" height="40" fill="none" stroke="#6E7F78" stroke-width="2"/>
    <rect x="220" y="180" width="40" height="40" fill="none" stroke="#6E7F78" stroke-width="2"/>
    <rect x="285" y="180" width="35" height="40" fill="none" stroke="#6E7F78" stroke-width="2"/>
    
    <rect x="90" y="245" width="40" height="40" fill="none" stroke="#6E7F78" stroke-width="2"/>
    <rect x="155" y="245" width="40" height="40" fill="none" stroke="#6E7F78" stroke-width="2"/>
    <rect x="220" y="245" width="40" height="40" fill="none" stroke="#6E7F78" stroke-width="2"/>
    <rect x="285" y="245" width="35" height="40" fill="none" stroke="#6E7F78" stroke-width="2"/>
    
    <!-- Door -->
    <rect x="175" y="280" width="50" height="60" fill="none" stroke="#6E7F78" stroke-width="2"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="380" font-family="Inter, sans-serif" font-size="14" fill="#8A908C" text-anchor="middle" opacity="0.6">
    Boutique
  </text>
</svg>
